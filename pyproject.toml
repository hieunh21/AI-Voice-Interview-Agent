[project]
name = "intervai"
version = "0.1.0"
description = "IntervAI — Vietnamese AI voice mock-interview agent for IT roles"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.7",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pyyaml>=6.0.2",
    "langgraph>=1.2.19",
    "google-genai>=2.34.0",
    "pypdf>=6.21.4",
    "python-multipart>=0.0.33",
    "httpx>=0.28",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "httpx2>=2.16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
# Editable installs: `ai` resolves from the repo root, `app` from backend/.
dev-mode-dirs = [".", "backend"]

[tool.hatch.build.targets.wheel]
# `backend/app` is importable as `app`; `ai` holds playbooks, schemas and (later) graphs.
packages = ["backend/app", "ai", "speech"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["frontend"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "C4", "PT"]
# Vietnamese text and typographic dashes are intentional in prompts/content.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["app", "ai", "speech"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["db: requires PostgreSQL via TEST_DATABASE_URL"]
