# Role/level → competency mapping. Single source of truth for which skills a role-level uses.
# Skill *content* lives in ai/playbooks/competencies/**/<skill_id>.md, never here.
#
# Rules enforced by `python -m ai.playbooks.lint`:
#   - all 3 roles × 3 levels are present; skill weights per role-level sum to 1.0
#   - each role-level has >= 2 core skills, and no more core skills than the smallest mode allows
#   - each role-level lists enough eligible skills for the largest mode's minimum
#   - every referenced skill exists, is a `question` skill, and supports that level
# Bump `version` whenever weights, core flags or mode limits change.

version: 1.0.0

modes:
  demo:
    display_name: Demo nhanh
    description: 3 câu hỏi chính, phù hợp để thử nhanh.
    main_questions: 3
    max_followups_per_question: 1
    max_turns: 6
    time_budget_minutes: 12
    skills: { min: 2, max: 3 }
  standard:
    display_name: Tiêu chuẩn
    description: 6 câu hỏi chính, hỏi sâu hơn như một vòng phỏng vấn kỹ thuật.
    main_questions: 6
    max_followups_per_question: 2
    max_turns: 15
    time_budget_minutes: 30
    skills: { min: 3, max: 4 }

levels:
  intern:
    display_name: Intern
    description: Thực tập sinh — nền tảng kiến thức và đồ án học tập.
  fresher:
    display_name: Fresher
    description: Mới tốt nghiệp hoặc dưới 1 năm kinh nghiệm.
  junior:
    display_name: Junior
    description: Khoảng 1–3 năm kinh nghiệm làm việc thực tế.

# Scored across every answer; never consume question slots.
cross_cutting_skills: [communication, problem_solving]

roles:
  ai_engineer:
    display_name: AI Engineer
    playbook: role_ai_engineer
    levels:
      intern:
        skills:
          machine_learning: { weight: 0.30, core: true }
          programming_fundamentals: { weight: 0.25, core: true }
          deep_learning: { weight: 0.20 }
          model_evaluation: { weight: 0.15 }
          rag_systems: { weight: 0.10 }
      fresher:
        skills:
          rag_systems: { weight: 0.25, core: true }
          machine_learning: { weight: 0.20, core: true }
          llm_agents: { weight: 0.20 }
          model_evaluation: { weight: 0.15 }
          deep_learning: { weight: 0.10 }
          programming_fundamentals: { weight: 0.10 }
      junior:
        skills:
          rag_systems: { weight: 0.25, core: true }
          llm_agents: { weight: 0.25, core: true }
          model_evaluation: { weight: 0.20 }
          deep_learning: { weight: 0.10 }
          machine_learning: { weight: 0.10 }
          system_design: { weight: 0.10 }

  backend_developer:
    display_name: Backend Developer
    playbook: role_backend_developer
    levels:
      intern:
        skills:
          programming_fundamentals: { weight: 0.35, core: true }
          api_design: { weight: 0.30, core: true }
          databases: { weight: 0.25 }
          system_design: { weight: 0.10 }
      fresher:
        skills:
          api_design: { weight: 0.30, core: true }
          databases: { weight: 0.30, core: true }
          system_design: { weight: 0.20 }
          sql: { weight: 0.10 }
          programming_fundamentals: { weight: 0.10 }
      junior:
        skills:
          databases: { weight: 0.30, core: true }
          system_design: { weight: 0.30, core: true }
          api_design: { weight: 0.25 }
          programming_fundamentals: { weight: 0.15 }

  data_engineer:
    display_name: Data Engineer
    playbook: role_data_engineer
    levels:
      intern:
        skills:
          sql: { weight: 0.40, core: true }
          programming_fundamentals: { weight: 0.25, core: true }
          data_processing: { weight: 0.20 }
          etl_pipeline: { weight: 0.15 }
      fresher:
        skills:
          sql: { weight: 0.30, core: true }
          etl_pipeline: { weight: 0.30, core: true }
          data_processing: { weight: 0.25 }
          databases: { weight: 0.15 }
      junior:
