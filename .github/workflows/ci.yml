name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend, AI layer & playbooks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: intervai
          POSTGRES_PASSWORD: intervai
          POSTGRES_DB: intervai_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U intervai -d intervai_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://intervai:intervai@localhost:5432/intervai_test
      TEST_DATABASE_URL: postgresql+asyncpg://intervai:intervai@localhost:5432/intervai_test
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Playbook lint
        # Switch to `--strict` once all playbooks are written and reviewed (production gate).
        run: uv run python -m ai.playbooks.lint
      - name: Tests (unit + migrations)
        run: uv run pytest

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
